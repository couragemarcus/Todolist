<!DOCTYPE html>
<html>

<head>
    <title>My Todo List</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <h1>My Todo List</h1>

    <form action="/add" method="POST">

        <input type="text"
               name="task"
               placeholder="Enter a task"
               required>

        <button type="submit">Add</button>

    </form>


    <h2>Tasks</h2>

    {% for task in tasks %}

        <p>
            {{ task }}

            <a href="/delete/{{ loop.index0 }}">
                Delete
            </a>
        </p>

    {% else %}

        <p>No tasks yet.</p>

    {% endfor %}

</body>

</html>
